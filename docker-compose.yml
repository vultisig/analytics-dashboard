version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: timescale/timescaledb:latest-pg15
    container_name: vultisig_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vultisig_analytics}
      POSTGRES_USER: ${POSTGRES_USER:-vultisig_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST_AUTH_METHOD: md5
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./vultisig-analytics/ingestors/database_schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vultisig_user} -d ${POSTGRES_DB:-vultisig_analytics}"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - vultisig-network

  # Python Backend API
  backend:
    build:
      context: ./vultisig-analytics
      dockerfile: Dockerfile
    container_name: vultisig_backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-vultisig_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-vultisig_analytics}
      ONEINCH_API_KEY: ${ONEINCH_API_KEY}
      ARKHAM_API_KEY: ${ARKHAM_API_KEY}
      ETHERSCAN_API_KEY: ${ETHERSCAN_API_KEY}
      INFURA_API_KEY: ${INFURA_API_KEY}
      ALCHEMY_API_KEY: ${ALCHEMY_API_KEY}
      LIFI_API_KEY: ${LIFI_API_KEY}
      MORALIS_API_KEY: ${MORALIS_API_KEY}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - vultisig-network

  # Next.js Dashboard
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: vultisig_dashboard
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8080
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - vultisig-network

  # Sync Service (Continuous Data Ingestion)
  sync:
    build:
      context: ./vultisig-analytics
      dockerfile: Dockerfile.sync
    container_name: vultisig_sync
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-vultisig_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-vultisig_analytics}
      ONEINCH_API_KEY: ${ONEINCH_API_KEY}
      ARKHAM_API_KEY: ${ARKHAM_API_KEY}
      ETHERSCAN_API_KEY: ${ETHERSCAN_API_KEY}
      INFURA_API_KEY: ${INFURA_API_KEY}
      ALCHEMY_API_KEY: ${ALCHEMY_API_KEY}
      LIFI_API_KEY: ${LIFI_API_KEY}
      MORALIS_API_KEY: ${MORALIS_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - vultisig-network

volumes:
  postgres_data:
    external: true
    name: vultisig-analytics_postgres_data

networks:
  vultisig-network:
    driver: bridge
