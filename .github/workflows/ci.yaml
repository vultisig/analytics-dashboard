name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: vultisig-analytics

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: vultisig-analytics/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        working-directory: .
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

  backend-db-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/postgres

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: vultisig-analytics/requirements.txt

      - name: Install dependencies
        run: pip install -r vultisig-analytics/requirements.txt

      - name: Run database tests
        run: |
          python3 -m unittest tests.test_swapkit_daily_db -v
          python3 -m unittest tests.test_swapkit_earned_adversarial_db tests.test_swapkit_earned_adversarial_api -v
